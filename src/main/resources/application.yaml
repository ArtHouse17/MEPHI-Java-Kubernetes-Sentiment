spring:
  application:
    name: sentiment-spring
  mvc:
    problemdetails:
      enabled: true
server:
  port: 8080
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
